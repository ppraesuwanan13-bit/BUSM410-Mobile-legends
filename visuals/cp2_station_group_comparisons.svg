<text x="454" y="565" class="muted" font-size="15" text-anchor="middle">High</text>
<text x="765.0" y="165" class="ink" font-size="18" font-weight="600" text-anchor="middle">Weekday peak share (terciles)</text>
<line x1="560" y1="535.0" x2="952" y2="535.0" class="grid"/>
<line x1="560" y1="445.0" x2="952" y2="445.0" class="grid"/>
<line x1="560" y1="355.0" x2="952" y2="355.0" class="grid"/>
<line x1="560" y1="265.0" x2="952" y2="265.0" class="grid"/>
